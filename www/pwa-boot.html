<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D2945">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Shbace Medical">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./splash_icon.png">
  <title>Shbace Medical</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 28px;
      color: #edf6ff; background: radial-gradient(ellipse at 50% 15%, #17446c 0, #0b2037 45%, #06111e 100%);
    }
    main { width: min(100%, 440px); text-align: center; padding: 34px 26px; border: 1px solid #3d82b855;
      border-radius: 28px; background: #0a1d31cc; box-shadow: 0 22px 70px #0007; }
    .mark { width: 82px; height: 82px; object-fit: contain; margin: 0 auto 20px; }
    h1 { margin: 0; font-size: clamp(27px, 7vw, 34px); letter-spacing: -.7px; }
    .sub { color: #a9c7e2; margin: 10px 0 26px; line-height: 1.6; }
    a, button { display: block; width: 100%; padding: 15px 18px; border: 0; border-radius: 14px; font-size: 16px;
      font-weight: 700; text-decoration: none; cursor: pointer; }
    #open { color: #061728; background: linear-gradient(135deg, #63d5ff, #2689e8); }
    #install { display: none; margin-top: 12px; color: #eaf6ff; border: 1px solid #5aa7dc88; background: #153a5b; }
    .guide { margin: 22px 0 0; padding-top: 18px; border-top: 1px solid #ffffff20; color: #b9cfe1; font-size: 13px; line-height: 1.7; }
    #status { min-height: 20px; margin: 14px 0 0; color: #81d7ff; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="./splash_icon.png" alt="Shbace Medical" onerror="this.style.display='none'">
    <h1>Shbace Medical</h1>
    <p class="sub">Your medical question bank, ready when you are.</p>
    <a id="open" href="./index.html">Open Shbace Medical</a>
    <button id="install" type="button">Install app</button>
    <p class="guide">On iPhone: open this page in Safari, tap Share, choose <b>Add to Home Screen</b>, keep <b>Open as Web App</b> enabled, then tap Add.</p>
    <p id="status" role="status" aria-live="polite">Preparing offline support…</p>
  </main>
  <script>
    (function () {
      'use strict';
      var status = document.getElementById('status');
      var installButton = document.getElementById('install');
      var deferredPrompt = null;
      var params = new URLSearchParams(location.search);
      var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      var launchFromHomeScreen = params.get('launch') === '1' || standalone;

      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        deferredPrompt = event;
        installButton.style.display = 'block';
      });
      installButton.addEventListener('click', async function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installButton.style.display = 'none';
      });

      (async function prepare() {
        try {
          if ('serviceWorker' in navigator && location.protocol === 'https:') {
            await navigator.serviceWorker.register('./service-worker.js', { scope: './' });
            await navigator.serviceWorker.ready;
            status.textContent = 'Offline support is ready.';
          } else {
            status.textContent = 'Open this site over HTTPS to enable offline support.';
          }
        } catch (error) {
          status.textContent = 'The app can still open; offline setup needs attention.';
        }
        if (launchFromHomeScreen) location.replace('./index.html');
      })();
    })();
  </script>
</body>
</html>
