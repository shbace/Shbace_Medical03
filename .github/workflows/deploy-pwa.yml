name: Deploy Shbace Medical PWA

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'splash_icon.png'
      - 'scripts/prepare_pwa_v2.py'
      - '.github/workflows/deploy-pwa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'www/**'
      - 'splash_icon.png'
      - 'scripts/prepare_pwa_v2.py'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate legacy and new PWA releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Validate source PWA
        run: |
          node -e "JSON.parse(require('fs').readFileSync('www/manifest.webmanifest', 'utf8'))"
          node --check www/service-worker.js
          node -e "const fs=require('fs'); const html=fs.readFileSync('www/pwa-boot.html','utf8'); const scripts=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/gi)]; if (!scripts.length) process.exit(1); scripts.forEach(s => new Function(s[1]));"
          test -s www/index.html
          test -s www/pwa-boot.html
          test -s www/manifest.webmanifest
          test -s www/service-worker.js
          test -s splash_icon.png

      - name: Assemble isolated PWA v2 for validation
        run: python scripts/prepare_pwa_v2.py --source www --icon splash_icon.png --output dist/site

      - name: Validate generated iPhone PWA v2
        run: |
          node -e "JSON.parse(require('fs').readFileSync('dist/site/v2/manifest.webmanifest', 'utf8'))"
          node --check dist/site/v2/service-worker.js
          test -s dist/site/v2/index.html
          test -s dist/site/v2/pwa-boot.html
          test -s dist/site/v2/icons/icon-192.png
          test -s dist/site/v2/icons/icon-512.png
          test -s dist/site/v2/icons/apple-touch-icon.png
          grep -q 'shbace-medical-pwa-v2-' dist/site/v2/service-worker.js

  deploy:
    name: Deploy both PWA versions to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble publishing directory
        run: python scripts/prepare_pwa_v2.py --source www --icon splash_icon.png --output dist/site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
