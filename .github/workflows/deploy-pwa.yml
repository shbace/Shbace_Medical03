name: Deploy Shbace Medical PWA

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'splash_icon.png'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare PWA publishing directory
        shell: bash
        run: |
          test -s www/index.html
          test -s www/pwa-boot.html
          test -s www/manifest.webmanifest
          test -s www/service-worker.js
          cp splash_icon.png www/splash_icon.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
