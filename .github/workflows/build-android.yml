name: Build Shbace Medical Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'scripts/prepare_android.py'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

concurrency:
  group: shbace-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate Android Studio project and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate web app and Capacitor configuration
        run: |
          test -s www/index.html
          test -s www/manifest.webmanifest
          test -s www/service-worker.js
          node --check www/native-bridge.js
          node -e "JSON.parse(require('fs').readFileSync('www/manifest.webmanifest', 'utf8'))"
      - name: Generate native Android project
        run: npx cap add android
      - name: Apply official app icon and native permissions
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/prepare_android.py splash_icon.png android/app/src/main
      - name: Sync Capacitor plugins and local web app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Prepare deliverables
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Shbace_Medical.apk
          zip -qr dist/Shbace_Medical_Android_Studio.zip \
            android www index.html package.json package-lock.json capacitor.config.ts \
            README_AR.md README_PWA_AR.md README_PWA_V2_AR.md CHANGELOG.md \
            splash_icon.png setup-android.bat setup-android.sh scripts/prepare_android.py \
            -x 'android/.gradle/*' 'android/app/build/*' '**/.DS_Store'
      - name: Upload Android Studio ZIP and APK
        uses: actions/upload-artifact@v4
        with:
          name: Shbace-Medical-Android-Deliverables
          path: |
            dist/Shbace_Medical_Android_Studio.zip
            dist/Shbace_Medical.apk
          if-no-files-found: error
          retention-days: 30
